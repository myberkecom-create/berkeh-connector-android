name: Build Android APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Build APK
        env:
          KEYSTORE_BASE64: ${{ secrets.BERKEH_KEYSTORE_BASE64 }}
          BERKEH_STORE_PASSWORD: ${{ secrets.BERKEH_STORE_PASSWORD }}
        shell: bash
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$BERKEH_STORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/berkeh.jks"
            export BERKEH_KEYSTORE="$RUNNER_TEMP/berkeh.jks"
            gradle --no-daemon :app:assembleRelease
          else
            gradle --no-daemon :app:assembleDebug
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: Berkeh-Connector-APK
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: error
      - name: Remove temporary signing material
        if: always()
        run: python -c "import os,pathlib; pathlib.Path(os.environ['RUNNER_TEMP'],'berkeh.jks').unlink(missing_ok=True)"
